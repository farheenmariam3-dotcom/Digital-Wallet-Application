<!DOCTYPE html>
<html>
<head>

<title>Withdraw Money</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-container">

    <h1>Withdraw Money</h1>

    <form method="POST">

        <input
            type="number"
            name="amount"
            placeholder="Enter Amount"
            required>

        <button type="submit">
            Withdraw
        </button>

    </form>

</div>

</body>
</html>
