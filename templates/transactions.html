<!DOCTYPE html>
<html>

<head>

    <title>Transaction History</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-container">

    <h1>Transaction History</h1>

    <table class="transaction-table">

        <tr>
            <th>ID</th>
            <th>Amount</th>
            <th>Type</th>
            <th>Date</th>
            <th>Time</th>
        </tr>

        {% for transaction in transactions %}

        <tr>
            <td>{{ transaction[0] }}</td>
            <td>₹ {{ transaction[2] }}</td>
            <td>{{ transaction[3] }}</td>
            <td>{{ transaction[4] }}</td>
            <td>{{ transaction[5] }}</td>
        </tr>

        {% endfor %}
     </table>

    <br>

    <a href="/dashboard">
        <button>Back To Dashboard</button>
    </a>

</div>


</body>

</html>
