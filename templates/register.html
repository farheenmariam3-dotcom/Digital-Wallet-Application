<!DOCTYPE html>
<html>
<head>

<title>Register</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-container">

<h1>Create Account</h1>

<form method="POST">

<input
type="text"
name="username"
placeholder="Enter Username"
required>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

<button type="submit">
Register
</button>

</form>

<br>

<a href="/">
<button>
Back To Login
</button>
</a>

</div>

</body>
</html>
